grafana:
  adminUser: admin
  # Pas de adminPassword ici : le chart génère un secret aléatoire
  # (<release>-grafana), récupéré via kubectl, jamais commité.
  envFromSecret: grafana-oidc-secret
  "grafana.ini":
    server:
      root_url: https://grafana.homelab.local
    auth.generic_oauth:
      enabled: true
      name: Authelia
      allow_sign_up: true
      client_id: grafana
      scopes: openid profile email groups
      auth_url: https://auth.homelab.local/api/oidc/authorization
      token_url: https://auth.homelab.local/api/oidc/token
      api_url: https://auth.homelab.local/api/oidc/userinfo
      use_pkce: true
  persistence:
    enabled: true
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 32Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
