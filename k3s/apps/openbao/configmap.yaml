apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
data:
  config.hcl: |
    ui = true
    disable_mlock = true

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = true
    }

    storage "raft" {
      path    = "/openbao/data"
      node_id = "openbao-0"
    }

    api_addr     = "http://openbao.openbao.svc.cluster.local:8200"
    cluster_addr = "http://openbao.openbao.svc.cluster.local:8201"
