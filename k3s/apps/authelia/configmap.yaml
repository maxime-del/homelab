apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
data:
  configuration.yml: |
    theme: 'dark'

    server:
      address: 'tcp://:9091/'

    log:
      level: 'info'

    totp:
      issuer: 'homelab.local'

    authentication_backend:
      file:
        path: '/config/users_database.yml'

    access_control:
      default_policy: 'deny'
      rules:
        - domain: '*.homelab.local'
          policy: 'one_factor'

    session:
      cookies:
        - domain: 'homelab.local'
          authelia_url: 'https://auth.homelab.local'

    regulation:
      max_retries: 5
      find_time: '2m'
      ban_time: '5m'

    storage:
      local:
        path: '/data/db.sqlite3'

    notifier:
      filesystem:
        filename: '/data/notification.txt'
