apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
data:
  configuration.yml: |
    theme: 'dark'

    server:
      address: 'tcp://:9091/'

    log:
      level: 'info'

    totp:
      issuer: 'homelab.local'

    authentication_backend:
      file:
        path: '/config/users_database.yml'

    access_control:
      default_policy: 'deny'
      rules:
        - domain: '*.homelab.local'
          policy: 'one_factor'

    session:
      cookies:
        - domain: 'homelab.local'
          authelia_url: 'https://auth.homelab.local'

    regulation:
      max_retries: 5
      find_time: '2m'
      ban_time: '5m'

    storage:
      local:
        path: '/data/db.sqlite3'

    notifier:
      filesystem:
        filename: '/data/notification.txt'

    identity_providers:
      oidc:
        claims_policies:
          kubernetes:
            id_token: ['email', 'groups']
        clients:
          - client_id: 'grafana'
            client_name: 'Grafana'
            client_secret: '$pbkdf2-sha512$310000$xDiyyPT471uziRG4wqAAow$ji/Ay7YsD7NamOlkOA3jXYKWeoO0/8XLDMrWNJnAmLy78lnDTC3BIlu36f/uIGIcbj41B301h/G1I3VHmgxXLw'
            public: false
            authorization_policy: 'one_factor'
            consent_mode: 'implicit'
            redirect_uris:
              - 'https://grafana.homelab.local/login/generic_oauth'
            scopes:
              - 'openid'
              - 'profile'
              - 'email'
              - 'groups'
            userinfo_signed_response_alg: 'none'
          - client_id: 'headlamp'
            client_name: 'Headlamp'
            client_secret: '$pbkdf2-sha512$310000$Rrl2jRu0uZku1TruaQNBHg$vZrSxwjZc2Js1S7O1hKiIv5Nb0tJ8tLvK1Lwps0Iy04bmckFWfC6Q.WZVWktzxw2JpnnA2vf4wu4o0i7iLfLXw'
            public: false
            authorization_policy: 'one_factor'
            consent_mode: 'implicit'
            claims_policy: 'kubernetes'
            redirect_uris:
              - 'https://headlamp.homelab.local/oidc-callback'
            scopes:
              - 'openid'
              - 'profile'
              - 'email'
              - 'groups'
            userinfo_signed_response_alg: 'none'
          - client_id: 'argocd'
            client_name: 'ArgoCD'
            client_secret: '$pbkdf2-sha512$310000$CuK1oY7cwmmEzuWsgekXkQ$KvOnPOrh9koV5c9HXxt3.8vx47jGBFxA4MCBH.ekytGHxundWmn4OCdh1qQklVnIlZtghcLkX0EhpGjIV.S2kA'
            public: false
            authorization_policy: 'one_factor'
            consent_mode: 'implicit'
            redirect_uris:
              - 'https://argocd.homelab.local/auth/callback'
            scopes:
              - 'openid'
              - 'profile'
              - 'email'
              - 'groups'
            userinfo_signed_response_alg: 'none'
