apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-secrets
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: authelia-secrets
  data:
    - secretKey: AUTHELIA_JWT_SECRET
      remoteRef:
        key: authelia/secrets
        property: AUTHELIA_JWT_SECRET
    - secretKey: AUTHELIA_SESSION_SECRET
      remoteRef:
        key: authelia/secrets
        property: AUTHELIA_SESSION_SECRET
    - secretKey: AUTHELIA_STORAGE_ENCRYPTION_KEY
      remoteRef:
        key: authelia/secrets
        property: AUTHELIA_STORAGE_ENCRYPTION_KEY
    - secretKey: AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET
      remoteRef:
        key: authelia/secrets
        property: AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-users
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: authelia-users
  data:
    - secretKey: users_database.yml
      remoteRef:
        key: authelia/users
        property: users_database.yml
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-oidc-key
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: authelia-oidc-key
  data:
    - secretKey: jwks.yml
      remoteRef:
        key: authelia/oidc-key
        property: jwks.yml
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-tls
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: authelia-tls
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: authelia/tls
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: authelia/tls
        property: tls.key
