apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: headlamp-oidc-secret
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: headlamp/oidc
        property: OIDC_CLIENT_SECRET
