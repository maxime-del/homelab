apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-website
  labels:
    app: profile-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: profile-website
  template:
    metadata:
      labels:
        app: profile-website
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        # Tag set by kustomization.yaml (bumped by the profile_website CI on every push to main)
        image: ghcr.io/maxime-del/profile_website:latest
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 20
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
