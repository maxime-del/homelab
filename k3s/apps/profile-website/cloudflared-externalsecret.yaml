apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: cloudflared-tunnel
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef:
        key: profile-website/cloudflared-tunnel
        property: TUNNEL_TOKEN
