apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: profile-website
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: maxime.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: profile-website-service
                port:
                  number: 80
