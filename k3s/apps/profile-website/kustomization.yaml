apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: profile-website

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - ingress-tailscale.yaml
  - cloudflared-externalsecret.yaml
  - cloudflared-deployment.yaml

# The profile_website CI rewrites newTag on every push to main; Argo CD then rolls it out.
images:
  - name: ghcr.io/maxime-del/profile_website
    newTag: sha-ca9e6ad
