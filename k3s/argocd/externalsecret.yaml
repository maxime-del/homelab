apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: oidc.authelia.clientSecret
      remoteRef:
        key: argocd/oidc
        property: clientSecret
