apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab
spec:
  project: default
  source:
    repoURL: https://github.com/maxime-del/homelab.git
    targetRevision: main
    path: k3s
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
